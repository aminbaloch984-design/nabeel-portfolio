<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">AI Assistant Website preview</title>
  <desc id="desc">A dark AI assistant interface with a glowing orb, prompt input, suggestion chips and chat history sidebar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0616"/>
      <stop offset="1" stop-color="#05030a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5f3ff"/>
      <stop offset="0.3" stop-color="#c084fc"/>
      <stop offset="0.62" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="input" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frame">
      <rect x="50" y="45" width="1100" height="660" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="650" cy="350" r="400" fill="url(#glow)" opacity="0.5" filter="url(#blur)"/>

  <rect x="50" y="45" width="1100" height="660" rx="22" fill="#080512" stroke="#2b2044" stroke-width="1.5"/>
  <g clip-path="url(#frame)">
    <rect x="50" y="45" width="1100" height="48" fill="#100a1b"/>
    <circle cx="78" cy="69" r="5" fill="#f87171"/>
    <circle cx="96" cy="69" r="5" fill="#fbbf24"/>
    <circle cx="114" cy="69" r="5" fill="#34d399"/>
    <rect x="142" y="59" width="280" height="21" rx="10" fill="#1b1229"/>
    <text x="158" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b7fa3">nova.ai/chat</text>

    <rect x="50" y="93" width="248" height="612" fill="#0d0817"/>
    <path d="M298 93v612" stroke="#251a38" stroke-width="1.5"/>
    <circle cx="1060" cy="400" r="280" fill="url(#glowCyan)" opacity="0.35" filter="url(#blur)"/>

    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="74" y="119" width="30" height="30" rx="9" fill="url(#brand)"/>
      <path d="M89 127l1.8 5.2L96 134l-5.2 1.8L89 141l-1.8-5.2L82 134l5.2-1.8L89 127z" fill="#fff"/>
      <text x="114" y="140" font-size="16" font-weight="700" fill="#f8f5fe" letter-spacing="-0.3">Nova AI</text>

      <rect x="72" y="166" width="204" height="38" rx="10" fill="url(#brand)"/>
      <path d="M90 185h10M95 180v10" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
      <text x="110" y="189" font-size="10.5" font-weight="600" fill="#fff">New conversation</text>

      <text x="74" y="234" font-size="8" font-weight="600" letter-spacing="1.4" fill="#6f6385">RECENT</text>
      <g font-size="10.5" fill="#9d8fb5">
        <rect x="66" y="246" width="216" height="32" rx="8" fill="#171022"/>
        <rect x="78" y="258" width="7" height="7" rx="2" fill="#8b5cf6"/>
        <text x="94" y="267">Landing page concept</text>
        <rect x="78" y="294" width="7" height="7" rx="2" fill="#3c2960"/>
        <text x="94" y="303">React component help</text>
        <rect x="78" y="330" width="7" height="7" rx="2" fill="#3c2960"/>
        <text x="94" y="339">Brand voice guidelines</text>
        <rect x="78" y="366" width="7" height="7" rx="2" fill="#3c2960"/>
        <text x="94" y="375">API integration idea</text>
      </g>

      <rect x="66" y="618" width="216" height="58" rx="12" fill="#171022" stroke="#291b40"/>
      <circle cx="86" cy="647" r="13" fill="#2b1a44"/>
      <text x="86" y="651" text-anchor="middle" font-size="9" font-weight="600" fill="#c4b5fd">N</text>
      <text x="108" y="641" font-size="10" font-weight="600" fill="#e9e2f5">Nabeel</text>
      <text x="108" y="656" font-size="8" fill="#7d7292">Free plan</text>
      <path d="M262 644l3 3 3-3" stroke="#6f6385" stroke-width="1.5" fill="none" stroke-linecap="round"/>

      <text x="328" y="128" font-size="12" font-weight="600" fill="#ece6f7">New conversation</text>
      <rect x="956" y="111" width="160" height="30" rx="15" fill="#140d21" stroke="#2c1d42"/>
      <circle cx="972" cy="126" r="3.5" fill="#67e8f9"/>
      <text x="982" y="130" font-size="9" fill="#b9a9d6">Nova 2.0 · Pro</text>
      <path d="M1092 122l3 4 3-4" stroke="#6f6385" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>

    <g>
      <circle cx="724" cy="270" r="68" fill="url(#glow)" filter="url(#soft)" opacity="0.8"/>
      <circle cx="724" cy="270" r="46" fill="url(#orb)"/>
      <circle cx="724" cy="270" r="46" fill="none" stroke="#c4b5fd" stroke-opacity="0.35"/>
      <ellipse cx="724" cy="270" rx="76" ry="30" fill="none" stroke="#8b5cf6" stroke-opacity="0.3" transform="rotate(-24 724 270)"/>
      <ellipse cx="724" cy="270" rx="100" ry="40" fill="none" stroke="#6d28d9" stroke-opacity="0.16" transform="rotate(32 724 270)"/>
      <circle cx="690" cy="242" r="3" fill="#67e8f9"/>
      <circle cx="764" cy="298" r="2.5" fill="#c4b5fd"/>
      <circle cx="782" cy="240" r="2" fill="#e9d5ff"/>

      <text x="724" y="388" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#fbf9ff" letter-spacing="-0.8">How can I help you today?</text>
      <text x="724" y="414" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#9d8fb5">Ask anything, explore an idea, or create something new.</text>

      <rect x="468" y="450" width="512" height="66" rx="18" fill="#100a1b" stroke="#382552" stroke-width="1.5"/>
      <text x="492" y="481" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#73668a">Ask Nova anything...</text>
      <rect x="490" y="493" width="58" height="18" rx="5" fill="#1c122b"/>
      <text x="498" y="505" font-family="Segoe UI, Arial, sans-serif" font-size="7.5" fill="#8d7fa3">⌘ + K</text>
      <circle cx="938" cy="483" r="16" fill="url(#input)"/>
      <path d="M933 483h7M940 480l3 3-3 3" stroke="#07121a" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="900" cy="483" r="15" fill="#1a1128" stroke="#2f2145"/>
      <path d="M900 476v8M897 479v3M903 479v3" stroke="#9d8fb5" stroke-width="1.4" stroke-linecap="round"/>

      <g font-family="Segoe UI, Arial, sans-serif" font-size="9">
        <rect x="468" y="536" width="112" height="30" rx="15" fill="#120b1d" stroke="#2a1c40"/>
        <path d="M485 544l-3 3 3 3M490 544l3 3-3 3" stroke="#a78bfa" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="501" y="554" fill="#b9a9d6">Write code</text>

        <rect x="590" y="536" width="138" height="30" rx="15" fill="#120b1d" stroke="#2a1c40"/>
        <circle cx="607" cy="551" r="3" fill="#67e8f9"/>
        <text x="618" y="554" fill="#b9a9d6">Explain a concept</text>

        <rect x="738" y="536" width="164" height="30" rx="15" fill="#120b1d" stroke="#2a1c40"/>
        <path d="M755 546h10v10h-10z" stroke="#c084fc" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
        <text x="773" y="554" fill="#b9a9d6">Design a landing page</text>
      </g>

      <text x="724" y="628" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#5f5474">Nova can make mistakes. Check important information.</text>
    </g>
  </g>
</svg>
