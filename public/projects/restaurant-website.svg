<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Restaurant Website preview</title>
  <desc id="desc">An elegant dark restaurant website with a warm gold hero, plated dish illustration, reservation button and menu highlights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#120b08"/>
      <stop offset="1" stop-color="#070403"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5efe6"/>
      <stop offset="0.55" stop-color="#d8cec0"/>
      <stop offset="1" stop-color="#a89b89"/>
    </linearGradient>
    <radialGradient id="food" cx="0.4" cy="0.35" r="0.8">
      <stop stop-color="#92400e"/>
      <stop offset="0.55" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#431407"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="frame">
      <rect x="50" y="45" width="1100" height="660" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="900" cy="320" r="380" fill="url(#glow)" opacity="0.35" filter="url(#blur)"/>

  <rect x="50" y="45" width="1100" height="660" rx="22" fill="#0b0705" stroke="#3a2a1c" stroke-width="1.5"/>
  <g clip-path="url(#frame)">
    <rect x="50" y="45" width="1100" height="48" fill="#15100b"/>
    <circle cx="78" cy="69" r="5" fill="#f87171"/>
    <circle cx="96" cy="69" r="5" fill="#fbbf24"/>
    <circle cx="114" cy="69" r="5" fill="#34d399"/>
    <rect x="142" y="59" width="270" height="21" rx="10" fill="#211a12"/>
    <text x="158" y="73" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#9d8a70">saveur.restaurant</text>

    <rect x="50" y="93" width="1100" height="612" fill="#0b0705"/>
    <ellipse cx="880" cy="330" rx="420" ry="310" fill="url(#glow)" opacity="0.25" filter="url(#blur)"/>
    <ellipse cx="180" cy="640" rx="300" ry="220" fill="url(#glowRed)" opacity="0.35" filter="url(#blur)"/>

    <g font-family="Georgia, 'Times New Roman', serif">
      <text x="90" y="142" font-size="21" font-weight="700" letter-spacing="4" fill="#f7f1e8">SAVEUR</text>
      <text x="90" y="157" font-family="Segoe UI, Arial, sans-serif" font-size="6.5" letter-spacing="2.5" fill="#a88b5e">SEASONAL KITCHEN</text>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#c6b59f">
      <text x="575" y="142">Menu</text>
      <text x="638" y="142">Our story</text>
      <text x="720" y="142">Gallery</text>
      <text x="790" y="142">Contact</text>
    </g>
    <rect x="963" y="119" width="137" height="36" rx="18" fill="url(#gold)"/>
    <text x="1031" y="142" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#251507">Reserve a table</text>

    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="90" y="207" width="124" height="24" rx="12" fill="#1b1309" stroke="#3d2d17"/>
      <circle cx="104" cy="219" r="3" fill="#f59e0b"/>
      <text x="114" y="223" font-size="8" letter-spacing="1.4" fill="#fcd34d">FINE DINING</text>

      <text x="90" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="47" font-weight="400" fill="#fbf6ee" letter-spacing="-1">A taste worth</text>
      <text x="90" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="47" font-weight="400" fill="#fbf6ee" letter-spacing="-1">remembering<tspan fill="#f59e0b">.</tspan></text>

      <text x="90" y="380" font-size="12" fill="#b9a68d">Seasonal ingredients, slow-cooked flavours and a table</text>
      <text x="90" y="399" font-size="12" fill="#b9a68d">made for the people you love.</text>

      <rect x="90" y="432" width="142" height="42" rx="21" fill="url(#gold)"/>
      <text x="161" y="458" text-anchor="middle" font-size="11" font-weight="700" fill="#251507">Reserve a table</text>
      <rect x="244" y="432" width="126" height="42" rx="21" fill="none" stroke="#4a3720"/>
      <text x="307" y="458" text-anchor="middle" font-size="11" fill="#e8dcc9">Explore menu</text>

      <g>
        <text x="90" y="528" font-size="8.5" letter-spacing="1.5" fill="#796856">OPEN TODAY</text>
        <text x="90" y="549" font-size="11" fill="#d8c7ae">5:00 PM — 11:00 PM</text>
        <text x="248" y="528" font-size="8.5" letter-spacing="1.5" fill="#796856">CHEF'S SPECIAL</text>
        <text x="248" y="549" font-size="11" fill="#d8c7ae">Truffle ribeye</text>
      </g>
    </g>

    <g>
