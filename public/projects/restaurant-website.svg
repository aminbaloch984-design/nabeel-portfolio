      <circle cx="890" cy="310" r="152" fill="url(#plate)"/>
      <circle cx="890" cy="310" r="152" fill="none" stroke="#fff" stroke-opacity="0.35"/>
      <circle cx="890" cy="310" r="126" fill="#e8dfd2"/>
      <circle cx="890" cy="310" r="126" fill="none" stroke="#b9aa96" stroke-width="1.5"/>
      <ellipse cx="890" cy="310" rx="103" ry="102" fill="#20140c"/>

      <ellipse cx="884" cy="316" rx="72" ry="48" fill="url(#food)" transform="rotate(-12 884 316)"/>
      <path d="M838 338c20-34 58-50 96-40 20 5 34 18 42 34-20 24-52 34-82 30-25-3-43-11-56-24z" fill="#92400e" opacity="0.75"/>
      <path d="M842 304c12-18 32-28 54-27M924 290c16 4 29 13 38 26" stroke="#fbbf24" stroke-width="2" opacity="0.55" stroke-linecap="round"/>
      <g fill="#65a30d">
        <ellipse cx="824" cy="326" rx="19" ry="10" transform="rotate(-28 824 326)"/>
        <ellipse cx="846" cy="352" rx="16" ry="8" transform="rotate(18 846 352)"/>
        <ellipse cx="952" cy="336" rx="18" ry="9" transform="rotate(28 952 336)"/>
      </g>
      <g fill="#dc2626">
        <circle cx="930" cy="282" r="9"/>
        <circle cx="948" cy="294" r="7"/>
        <circle cx="913" cy="273" r="6"/>
      </g>
      <g fill="#fde68a" opacity="0.9">
        <circle cx="860" cy="282" r="3"/>
        <circle cx="878" cy="270" r="2.5"/>
        <circle cx="898" cy="266" r="3"/>
        <circle cx="870" cy="348" r="2.5"/>
      </g>
      <path d="M812 370c26 18 58 25 90 19" stroke="#7c2d12" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>

      <rect x="1002" y="192" width="132" height="48" rx="14" fill="#15100a" stroke="#3d2d17"/>
      <circle cx="1021" cy="216" r="9" fill="#2a1d0e"/>
      <path d="M1021 210l2 4 4 .6-3 3 .7 4.4-3.7-2-3.7 2 .7-4.4-3-3 4-.6 2-4z" fill="#fbbf24"/>
      <text x="1038" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#9d8a70">Guest rating</text>
      <text x="1038" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#f7f1e8">4.9 / 5.0</text>

      <circle cx="1058" cy="402" r="42" fill="#15100a" stroke="#3d2d17"/>
      <path d="M1058 382c-8 8-12 16-12 24 0 8 5 14 12 14s12-6 12-14c0-8-4-16-12-24z" fill="#f59e0b" opacity="0.85"/>
      <path d="M1058 390v20" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
      <text x="1058" y="433" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7" letter-spacing="1" fill="#9d8a70">SIGNATURE</text>
    </g>

    <g>
      <rect x="90" y="584" width="268" height="88" rx="14" fill="#120d08" stroke="#302416"/>
      <circle cx="124" cy="628" r="22" fill="#2a1d0e"/>
      <circle cx="124" cy="628" r="14" fill="#f59e0b" opacity="0.75"/>
      <text x="158" y="617" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#f7f1e8">Charred octopus</text>
      <text x="158" y="634" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#8f7c64">Smoked paprika · lemon</text>
      <text x="158" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">$24</text>

      <rect x="376" y="584" width="268" height="88" rx="14" fill="#120d08" stroke="#302416"/>
      <circle cx="410" cy="628" r="22" fill="#2a1d0e"/>
      <circle cx="410" cy="628" r="14" fill="#dc2626" opacity="0.7"/>
      <text x="444" y="617" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#f7f1e8">Truffle ribeye</text>
      <text x="444" y="634" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#8f7c64">Aged beef · wild mushrooms</text>
      <text x="444" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">$38</text>

      <rect x="662" y="584" width="268" height="88" rx="14" fill="#120d08" stroke="#302416"/>
      <circle cx="696" cy="628" r="22" fill="#2a1d0e"/>
      <circle cx="696" cy="628" r="14" fill="#65a30d" opacity="0.7"/>
      <text x="730" y="617" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#f7f1e8">Saffron risotto</text>
      <text x="730" y="634" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#8f7c64">Parmesan · garden herbs</text>
      <text x="730" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#fbbf24">$21</text>
