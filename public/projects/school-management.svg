<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">School Management Website preview</title>
  <desc id="desc">A dark purple school administration dashboard with student statistics, attendance chart and student table.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d0718"/>
      <stop offset="1" stop-color="#06030c"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="screen">
      <rect x="60" y="55" width="1080" height="640" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1030" cy="90" r="330" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="170" cy="690" r="260" fill="url(#glowCyan)" filter="url(#blur)"/>

  <rect x="60" y="55" width="1080" height="640" rx="22" fill="#0b0714" stroke="#31204a" stroke-width="1.5"/>
  <g clip-path="url(#screen)">
    <rect x="60" y="55" width="1080" height="50" fill="#130c20"/>
    <circle cx="88" cy="80" r="5" fill="#f87171"/>
