      <path d="M96 152l7-12 7 12M101 143v11M108 152h6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="132" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f5f2fc">EduFlow</text>
      <text x="86" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.6" fill="#6f6385">MENU</text>

